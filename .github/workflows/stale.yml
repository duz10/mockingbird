# Mockingbird stale-bot
#
# Daily sweep over inactive issues and PRs. Reflects the solo
# maintainer posture: outside contributors are redirected to
# Discussions for non-bug interaction and to forks for code changes.
# All user-visible strings here are em-dash-free per house style.
name: Stale

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 30
          days-before-pr-stale: 30
          days-before-pr-close: 30
          stale-issue-message: >
            This issue has been inactive for 30 days. It will be closed
            in 30 more days if there is no further activity. Open a
            Discussion if this matters to you and the maintainer has
            not had bandwidth to address it.
          stale-pr-message: >
            This pull request has been inactive for 30 days. As noted
            in CONTRIBUTING.md, this project is a reference
            implementation and most PRs are not prioritized for merge.
            It will be closed in 30 more days if there is no further
            activity. Forks are welcomed and remain the recommended
            path for outside contributors.
          close-issue-message: >
            Closing as stale. Please reopen if circumstances change.
          close-pr-message: >
            Closing as stale. Thanks for considering a contribution.
            Forks remain welcome.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,bug-confirmed
          exempt-pr-labels: pinned,security,review-requested
          operations-per-run: 100
