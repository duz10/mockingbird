# Mockingbird Release
#
# Fires on version tags (`v*.*.*` and pre-release variants like
# `v0.2.0-beta.1`) or manual dispatch. Builds the Tauri bundle on
# every matrix entry and attaches artifacts to a DRAFT GitHub Release.
# The maintainer reviews and publishes the draft manually so a
# misconfigured tag cannot accidentally ship a public release.
#
# Matrix shape:
#
#   * windows-latest + variant=cpu  -> Mockingbird-Setup-x.y.z.msi
#       Whisper runs on CPU. Works on any 64-bit Windows machine.
#       Roughly 50 MB download, 80 MB installed.
#
#   * windows-latest + variant=cuda -> Mockingbird-CUDA-Setup-x.y.z.msi
#       Whisper runs on NVIDIA GPU via cuBLAS. The bundle includes
#       cudart64_12.dll + cublas64_12.dll + cublasLt64_12.dll from the
#       CUDA 12.x runtime so the user does not need to install the
#       CUDA Toolkit separately. Roughly 250 MB download, 770 MB
#       installed. Driver-supplied nvcuda.dll is the only user-side
#       prereq and ships with every NVIDIA driver via Windows Update
#       or GeForce Experience.
#
# The CUDA variant uses a separate Tauri config overlay
# (src-tauri/tauri.cuda.conf.json) that overrides productName to
# Mockingbird-CUDA so installer filenames and Add/Remove Programs
# entries are unambiguous, and lists the three runtime DLLs in
# bundle.resources so they ship inside the MSI.
#
#   * macos-latest + variant=cpu -> Mockingbird_x.y.z_aarch64.dmg
#       Apple Silicon. Whisper runs on the Metal GPU backend. The .dmg
#       is self-contained (~600 MB): the whisper-large-v3-turbo GGUF,
#       silero_vad.onnx, and libonnxruntime.dylib are fetched on the
#       runner (download-models.sh + download-onnxruntime.sh) and copied
#       into Contents/Resources/models/ by the macOS config overlay
#       (src-tauri/tauri.macos.conf.json). Shipped UNSIGNED (no Apple
#       Developer account) -- Gatekeeper is cleared via the Homebrew
#       cask (quarantine stripped on install) or the documented
#       xattr / "Open Anyway" path. Roughly 600 MB download/installed.
#
# No code-signing secrets are wired for the beta. Bundles ship unsigned
# per charter. Future signing will plug in via
# TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (VS 17) per mb-wgla. windows-latest
          # rolled to VS 18 (2026) and broke whisper-rs-sys CMake builds
          # via cache poisoning. Matches the dev box wrapper which
          # imports vcvars64 from VS 2022.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            variant: cpu
            tauri_args: --target x86_64-pc-windows-msvc
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            variant: cuda
            tauri_args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.cuda.conf.json --features mockingbird/cuda
          # macOS (Apple Silicon) beta lane. Mirrors the Windows CPU
          # lane's tauri-action approach but bundles a self-contained
          # ~600 MB .dmg for aarch64-apple-darwin:
          #   * UNSIGNED -- no Apple Developer account. Signing/
          #     notarization inputs are left empty, same beta posture as
          #     the Windows MSIs. Users clear Gatekeeper via Homebrew
          #     cask (strips quarantine) or the documented
          #     `xattr -dr com.apple.quarantine` / "Open Anyway"
          #     (System Settings > Privacy & Security on Sequoia 15).
          #   * Models are gitignored, so they are FETCHED ON THE RUNNER
          #     (download-models.sh + download-onnxruntime.sh) before the
          #     build. The macOS config overlay
          #     (src-tauri/tauri.macos.conf.json) copies them into
          #     Contents/Resources/models/ so the .dmg is self-contained
          #     (Whisper GGUF + Silero VAD + libonnxruntime.dylib).
          #   * --features mockingbird/metal -> Whisper on the Metal GPU
          #     backend (mirrors how the Windows cuda lane injects
          #     --features mockingbird/cuda). minimumSystemVersion 15.0
          #     in tauri.conf.json governs the deployment-target floor.
          #   * tauri-action attaches the resulting .dmg to the SAME
          #     draft release as the MSIs.
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: cpu
            tauri_args: --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json --features mockingbird/metal --bundles dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS build tools (cmake, jq)
        if: matrix.os == 'macos-latest'
        # cmake: whisper-rs-sys build.rs compiles the bundled whisper.cpp
        # (macOS Command Line Tools does NOT ship cmake, unlike VS on
        # Windows). jq: required by download-models.sh to read
        # scripts/model-manifest.json. curl + tar are already native.
        run: brew install cmake jq

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache keys per variant. The cuda variant compiles
          # whisper-rs-sys with the cuda feature which produces a
          # different artifact set than the cpu variant; sharing the
          # cache across variants would force a full rebuild on every
          # run and cause stale-artifact confusion. matrix.os is folded
          # in so a future runner image bump auto-invalidates the cache
          # (mb-wgla).
          key: ${{ matrix.variant }}-${{ matrix.os }}

      - name: Install CUDA Toolkit 12.8
        if: matrix.variant == 'cuda'
        # v0.2.35: first release whose Node runtime is 24 (matches GHA's
        # forced upgrade off Node 20) AND has 12.8.0 in its windows-links
        # allowlist. v0.2.19 errored with `Version not available: 12.8.0`.
        # mb-tk9s.
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.0"
          # Only need the bits required to compile whisper-rs-sys/cuda
          # and stage runtime DLLs. The full toolkit is ~3.5 GB; this
          # subset is closer to 1.5 GB and shaves several minutes off
          # the CI run.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          method: "network"

      - name: Install UI deps
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: UI build
        working-directory: ui
        run: npm run build

      - name: Stage CUDA runtime DLLs
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          powershell -File scripts\dev\stage-cuda-runtime.ps1

      - name: macOS - fetch models + build tuning
        if: matrix.os == 'macos-latest'
        # The models are gitignored, so fetch them into ./models BEFORE
        # the build -- the macOS config overlay bundles ./models/* into
        # Contents/Resources/models/, so they must exist first. Both
        # scripts default OUTPUT_DIR to <repo>/models and need no dev env
        # vars the runner lacks. ONNX Runtime first so its versioned
        # dylib (libonnxruntime.1.22.0.dylib, referenced by the overlay)
        # is present.
        #
        # Parallelism: macos-latest arm64 runners are RAM-constrained
        # (comparable to the 8 GB dev box, whose cargo-mac.sh caps jobs
        # at 2). 3 is a safe ceiling for whisper.cpp + Metal shader
        # compiles; dial down if the first real run OOMs. Note:
        # `cargo tauri build` derives MACOSX_DEPLOYMENT_TARGET from
        # bundle.macOS.minimumSystemVersion (15.0) in tauri.conf.json,
        # so no deployment-target export is needed here.
        run: |
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=3" >> "$GITHUB_ENV"
          scripts/download-onnxruntime.sh
          scripts/download-models.sh

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing intentionally omitted for beta releases.
          # Future:
          #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mockingbird ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for release notes."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          args: ${{ matrix.tauri_args }}

      - name: macOS - verify the .app is ad-hoc signed (guardrail)
        if: matrix.os == 'macos-latest'
        # Regression guard for the "damaged and should be uninstalled"
        # Gatekeeper failure. Without bundle.macOS.signingIdentity "-"
        # (set in tauri.macos.conf.json), tauri never runs `codesign`
        # over the assembled bundle, so the only signature is the one the
        # linker auto-applies to the inner Mach-O -- the bundle seals no
        # Resources (Sealed Resources=none) and `codesign --verify` fails
        # with "code has no resources but signature indicates they must
        # be present". A downloaded copy then reads as "damaged". Fail the
        # release here rather than ship an un-launchable .dmg.
        run: |
          set -euo pipefail
          # Locate the assembled bundle regardless of workspace target-dir
          # layout (root ./target vs ./src-tauri/target).
          APP="$(find . -type d -path '*/release/bundle/macos/Mockingbird.app' -print -quit)"
          test -n "$APP" || { echo 'ERROR: Mockingbird.app not found'; exit 1; }
          echo "Verifying signature of $APP"
          codesign -dv --verbose=4 "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Confirm the bundled model/dylib Resources are actually sealed.
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Sealed Resources version' \
            || { echo 'ERROR: bundle Resources are not sealed'; exit 1; }
