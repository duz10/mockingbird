# Mockingbird CI
#
# Gates pushes to main and runs read-only on PRs (default token scopes;
# will not write back to fork branches).
#
# Why no `cargo test`:
#   The test binaries link clean locally (`cargo test --release --no-run`
#   passes) but exec hits a known DLL ABI mismatch on the maintainer's
#   Windows + CUDA box (LESSONS 2026-05-17). CI behavior on GitHub
#   runners is untested and would add a debugging burden disproportionate
#   to its value during the beta. We rely on `cargo check` + local
#   `--no-run` validation + manual QA matrix instead.
#
# Why no `--release` on clippy:
#   Local dev pins `--release` to reuse whisper-rs-sys CUDA artifacts.
#   CI has no CUDA, no cached artifacts, and runs in debug. Clippy in
#   debug still validates the full type and trait surface.
#
# Why no cargo-with-cuda wrapper:
#   GitHub runners have no MSVC vcvars / CUDA installation to import.
#   The wrapper is dev-box specific. Plain cargo works fine in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned to windows-2022 (VS 17) so the toolchain matches the dev
        # box wrapper (scripts\dev\cargo-with-cuda.ps1 imports vcvars64
        # from VS 2022). windows-latest rolled forward to VS 18 (2026)
        # and poisoned a stale cargo cache built against VS 17 in run
        # 27649041528 (whisper-rs-sys CMake generator mismatch). mb-wgla.
        os: [windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Inject the runner image label so a future intentional bump
          # (windows-2022 -> windows-2025) auto-invalidates the cache.
          # Swatinem's default key uses runner.os = "Windows" which does
          # NOT distinguish runner image versions. mb-wgla.
          key: ${{ matrix.os }}

      # `--ignore-scripts` is mandatory per repo hook policy
      # (block-unsafe-npm). Mini Shai-Hulud guard.
      - name: Install UI deps
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: UI type check
        working-directory: ui
        run: npx tsc --noEmit

      - name: UI tests
        working-directory: ui
        run: npm test

      - name: UI build
        working-directory: ui
        run: npm run build

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      # `--all-targets` covers bins, examples, tests, benches. Dev/test/
      # eval/probe one-shots live under `src-tauri/src/dev_bins/` and are
      # declared as `[[example]]` targets in `src-tauri/Cargo.toml` (mb-d1ii)
      # so they get linted here but never reach the Tauri MSI bundler
      # (which scans `src/bin/` directly, bypassing Cargo metadata).
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --all-targets

      # cargo-audit is warn-only: advisories surface in the job log as
      # warnings but do not fail the build. The maintainer reviews
      # findings periodically and bumps deps as appropriate. This
      # prevents transient upstream advisories from blocking unrelated
      # PRs.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit (warn-only)
        continue-on-error: true
        run: cargo audit
