[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.3.0-beta.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Dustin Boyd"]
repository = "TODO(repo-url)"  # Resolve pre-Phase-7 (Section -1 item 3)

[workspace.dependencies]
# Tauri v2 — desktop application shell.
# `macos-private-api` is required for `app.macOSPrivateApi: true` in
# tauri.conf.json (transparent overlay windows render black on macOS
# without it — the "window is set transparent but macos-private-api is
# not enabled" runtime warning). No-op on Windows/Linux, so it stays in
# the shared workspace dep. Source-build path only; the App Store
# private-API caveat does not apply.
tauri          = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-build    = { version = "2" }
# tauri-plugin-dialog: native save-as / open dialogs (Tauri 2 moved
# these out of core). Phase MC Wave 5 uses it for the meeting export
# Save As… picker. In-org crate, on the Mini Shai-Hulud known-good
# list as of phase-4-complete.
tauri-plugin-dialog = { version = "2", default-features = false }

# Database — see ADR 0004 (rusqlite over sqlx).
rusqlite       = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

# Serialization.
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# Async runtime — kept minimal in Phase 1 (no full multi-thread runtime yet).
tokio          = { version = "1", features = ["rt", "macros", "sync"] }

# Observability.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# Pattern matching for PII scrub layer.
regex          = "1"

# Phase 2 — Audio capture.
# `cpal` is pure-Rust + thin OS wrappers (WASAPI / CoreAudio / ALSA).
# `ringbuf` is the lock-free SPSC for the capture→consumer handoff.
# `hound` is for WAV I/O (CLI harness + fixture loading in tests).
cpal           = "0.15"
ringbuf        = "0.4"
hound          = "3"
# Sample-rate + channel-count conversion. cpal hands us whatever the
# device's native config is (commonly 44.1 kHz or 48 kHz stereo f32 on
# Windows); rubato downsamples to the 16 kHz mono i16 the rest of the
# pipeline expects. ADR 0013 pre-approved this; Phase 2 deferred it
# because the dev box happened to expose 16 kHz natively — but real
# users almost never do.
rubato         = "0.16"

# Phase 2 — STT + VAD (heavy deps).
# `ort` is the ONNX runtime for Silero VAD (ADR 0012). Default features
# include `download-binaries` which bundles the ONNX Runtime DLLs.
# ort 2 is still in release-candidate. Pin explicitly to ride patch
# RCs but block surprise major bumps.
#
# `load-dynamic`: skip static link of libonnxruntime.lib. That lib is
# built with MSVC 2022 STL symbols (__std_find_trivial_*) and won't
# link against VS 2019 BuildTools toolchains. With load-dynamic, we
# `dlopen` onnxruntime.dll at runtime instead — works with any MSVC.
#
# Use `default-features = false` to drop `download-binaries` (which
# fetches the static lib) and add `ndarray` back explicitly.
ort            = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }

# whisper-rs — Phase 2 Wave 4 / Wave 5 GPU re-enable.
#
# Workspace dep is CPU-only by default. The `cuda` Cargo feature on the
# `mockingbird` package (src-tauri/Cargo.toml) opts in to whisper-rs's
# CUDA build, which compiles against CUDA 12.8 installed side-by-side
# with the existing CUDA 13.2 (the chocolatey-default). CUDA_PATH must
# point at v12.8 (see ADR 0011 + scripts/dev/cargo-with-cuda.ps1).
# Local-dev cargo invocations go through that wrapper, which injects
# `--features mockingbird/cuda` automatically for build-y verbs. CI
# runs vanilla cargo with no features, so the windows-latest runner
# (no CUDA toolkit) builds CPU-only.
#
# ADR 0011's runtime CPU fallback still applies at app launch: with
# the cuda feature on, GPU init is attempted first and falls back to
# CPU if the driver is missing, OOM, etc; with the cuda feature off,
# WhisperContextParameters::use_gpu(true) is a no-op and we get a CPU
# context directly (see WhisperStt::new).
whisper-rs     = { version = "0.16" }

# Phase 2 — Benchmarks.
criterion      = { version = "0.5", features = ["html_reports"] }

# Std-adjacent.
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1", features = ["v4", "serde"] }
thiserror      = "1"

# Windows-only OS surface.
# Phase 1 features: Foundation + UI_Shell (path/registry helpers).
# Phase 3 features (hotkey + injection + window context):
#   - UI_WindowsAndMessaging: SetWindowsHookEx, GetForegroundWindow,
#     GetGUIThreadInfo, GetWindowTextW, GetWindowLongPtrW
#   - UI_Input_KeyboardAndMouse: SendInput + KEYBDINPUT + VIRTUAL_KEY
#   - System_DataExchange: clipboard open/set/get/enum (ONLY paste.rs)
#   - System_Memory: GlobalAlloc / GlobalLock for clipboard HGLOBAL
#   - System_Threading: GetCurrentThreadId for hook thread bookkeeping
#   - System_ProcessStatus: GetModuleBaseNameW for foreground process name
windows        = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # Phase 4 — DPAPI for Anthropic API key encryption at rest.
    "Win32_Security_Cryptography",
    # Phase 10 Wave 2 — UI Automation for activity-capture deep snapshots
    # (IUIAutomation, IUIAutomationElement, control-type ids, tree walker,
    # property ids including UIA_IsPasswordPropertyId per Wave 5 plan).
    "Win32_UI_Accessibility",
    # Phase 10 Wave 2 — monitor enumeration for multi-monitor attribution
    # (MonitorFromWindow, GetMonitorInfoW, GetDpiForMonitor live under Gdi/HiDpi).
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    # Phase 10 Wave 2 — GetLastInputInfo for coarse idle detection.
    "Win32_System_SystemInformation",
    # Phase 10 Wave 2 — CoInitializeEx / CoUninitialize for the UIA COM
    # client thread (apartment lifecycle bound to the sampler thread).
    "Win32_System_Com",
    # Phase 10 Wave 2 — VARIANT helpers used by UIA property gets.
    "Win32_System_Variant",
    "Win32_System_Ole",
] }

# Phase 3 — Static per-app injection-strategy override table.
# Zero-allocation compile-time lookup. See ADR 0016.
phf            = { version = "0.11", features = ["macros"] }

# Phase MC — CRC32 for meeting chunk-WAV integrity verification.
# Used by meetings/chunker.rs to stamp each rolled chunk; long_form_stt
# verifies on read. Pure-Rust, sub-microsecond per chunk, no SIMD
# autodetect surprises.
crc32fast      = "1.4"

# ADR 0046 Iter 2 / mb-p7cp — SHA-256 over each projected Markdown
# file for the manifest's content_sha256 column. The reconciliation
# engine uses these hashes to skip writes of byte-identical content,
# so the `projection-is-deterministic` invariant judge can prove
# re-projection is a no-op. Already transitively in the dep tree via
# rustls; promoted to a direct dep for explicit-at-call-site.
sha2           = "0.10"

# Phase 10 Wave 5 — PDF export for Activity sessions (ADR 0044).
# Pure-Rust, MIT-licensed, no native deps. We only use it from
# `activity/pdf_export.rs`. Pinned narrow to ride patch updates.
printpdf       = { version = "0.7", default-features = false }

# ADR 0046 Iter 1 / mb-hxm4 — pure-Rust audio decode. Drops every codec
# we don't open (FLAC, ALAC, Opus, ADPCM, ...) and the optional simd
# accel; keeps AAC + isomp4 (iPhone Voice Memos), WAV / MP3 / OGG +
# Vorbis (open-ended file picker). MIT/Apache, no system codec deps.
symphonia      = { version = "0.5", default-features = false, features = [
    "aac",      # iPhone Voice Memo codec
    "isomp4",   # m4a container
    "wav",      # WAV demuxer (PCM samples live behind the `pcm` codec)
    "pcm",      # PCM sample decoder — needed for WAV + uncompressed AIFF
    "mp3",
    "vorbis",
    "ogg",
] }

# ADR 0046 §6 / Iter 3 / mb-9lgi — filesystem watcher for the inbox
# courier flow (iOS Shortcut writes into `<vault>/inbox/`). ADR §6
# mandates `notify-debouncer-full` over raw `notify` because Windows
# `ReadDirectoryChangesW` events under bursts duplicate / lose / coalesce
# poorly without debouncing — confirmed empirically by Wave 0 spike
# Finding 3 (3-4 duplicate events within ~12 ms per logical change).
# `notify-debouncer-full` 0.3.x depends on notify 6 and ships its own
# debouncer thread.
notify-debouncer-full = "0.3"

# ADR 0046 §3.2 (mb-7vyz) — sibling input channel for the dictation
# orchestrator's `run` loop, carrying `HeadlessIngestRequest`s from the
# `+ Audio file` IPC (Iter 1) and the inbox-watcher courier flow (Iter 3).
# std::sync::mpsc cannot be multi-`select!`ed, and the existing
# `Receiver<StateAction>` is out-of-boundary to convert. A crossbeam pair
# (with an in-thread mpsc→crossbeam bridge for the existing action stream)
# is the minimum-diff topology that satisfies §3's headless-entry contract.
# Already in the dep closure transitively (notify, rayon); promoted to a
# direct dep so usage is explicit at the call site.
crossbeam-channel = "0.5"

# Phase 1A KG (ADR 0049 / mb-2mc9) — YAML deserialization for the
# schema-driven KG pipeline's SCHEMA.md companion configs (entity
# taxonomy, prompt routing). Pure-Rust, MIT, transitively brought in
# by other deps already; promoted to a direct workspace dep so the
# kg:: subsystem can express it explicitly. No `reqwest` is added —
# kg::ollama rides the existing ureq stack (ADR 0021).
serde_yaml     = "0.9"

# Phase 4 — Sync HTTP for cleanup providers (Ollama + Claude).
# See ADR 0021: kept sync to fit the orchestrator's sync architecture
# without dragging in a tokio runtime per dictation. `rustls-tls`
# avoids OpenSSL on Windows. `json` for serde body marshalling.
ureq           = { version = "2.10", default-features = false, features = ["tls", "json"] }

# Dev / test helpers.
tempfile       = "3"
rstest         = "0.18"
proptest       = "1"
mockall        = "0.12"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true
