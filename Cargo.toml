[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Dustin Boyd"]
repository = "TODO(repo-url)"  # Resolve pre-Phase-7 (Section -1 item 3)

[workspace.dependencies]
# Tauri v2 — desktop application shell.
tauri          = { version = "2", features = ["tray-icon"] }
tauri-build    = { version = "2" }

# Database — see ADR 0004 (rusqlite over sqlx).
rusqlite       = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

# Serialization.
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# Async runtime — kept minimal in Phase 1 (no full multi-thread runtime yet).
tokio          = { version = "1", features = ["rt", "macros", "sync"] }

# Observability.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# Pattern matching for PII scrub layer.
regex          = "1"

# Phase 2 — Audio capture.
# `cpal` is pure-Rust + thin OS wrappers (WASAPI / CoreAudio / ALSA).
# `ringbuf` is the lock-free SPSC for the capture→consumer handoff.
# `hound` is for WAV I/O (CLI harness + fixture loading in tests).
cpal           = "0.15"
ringbuf        = "0.4"
hound          = "3"

# Phase 2 — STT + VAD (heavy deps).
# `ort` is the ONNX runtime for Silero VAD (ADR 0012). Default features
# include `download-binaries` which bundles the ONNX Runtime DLLs.
# ort 2 is still in release-candidate. Pin explicitly to ride patch
# RCs but block surprise major bumps.
#
# `load-dynamic`: skip static link of libonnxruntime.lib. That lib is
# built with MSVC 2022 STL symbols (__std_find_trivial_*) and won't
# link against VS 2019 BuildTools toolchains. With load-dynamic, we
# `dlopen` onnxruntime.dll at runtime instead — works with any MSVC.
#
# Use `default-features = false` to drop `download-binaries` (which
# fetches the static lib) and add `ndarray` back explicitly.
ort            = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }

# whisper-rs — Phase 2 Wave 4.
#
# The `cuda` feature is intentionally OFF in Wave 4 because whisper-rs
# 0.13's bundled whisper.cpp/ggml CUDA build fails against CUDA 13.x:
#   1. ggml hard-codes CUDA architectures 52;61;70;75; CUDA 13 dropped
#      pre-Turing support, MSBuild's CudaToolkitDir comes up empty
#      against CUDA 13's integration files.
#   2. Chocolatey ships only CUDA 13.2.1; no older version available.
#
# This is the EXACT scenario ADR 0011's runtime CPU fallback was
# designed for. WhisperStt::new() tries `use_gpu=true` first; without
# the cuda feature compiled in, whisper-rs falls back to CPU at runtime
# (libwhisper.lib was built without CUDA kernels). When CUDA 12.x is
# installed alongside CUDA 13 (manual install from developer.nvidia.com),
# flip the feature back on and the GPU path activates automatically.
#
# See bd issue tracker for the GPU re-enable follow-up task.
whisper-rs     = { version = "0.16" }

# Phase 2 — Benchmarks.
criterion      = { version = "0.5", features = ["html_reports"] }

# Std-adjacent.
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1", features = ["v4", "serde"] }
thiserror      = "1"

# Windows-only OS surface (path/registry helpers).
windows        = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
] }

# Dev / test helpers.
tempfile       = "3"
rstest         = "0.18"
proptest       = "1"
mockall        = "0.12"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true
