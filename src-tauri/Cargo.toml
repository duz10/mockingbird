[package]
name           = "mockingbird"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description    = "Local-first voice dictation for Windows. Privacy-respecting, self-improving."

[lib]
name       = "mockingbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri              = { workspace = true }
tauri-plugin-dialog = { workspace = true }
rusqlite           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
regex              = { workspace = true }

# Phase 2 Wave 1 — Audio capture deps.
cpal               = { workspace = true }
ringbuf            = { workspace = true }
hound              = { workspace = true }
rubato             = { workspace = true }

# Phase 2 Wave 3 — VAD dep.
ort                = { workspace = true }

# Phase 2 Wave 4 — STT dep.
whisper-rs         = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
thiserror          = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# Phase 3 — per-app injection-strategy override table (ADR 0016).
phf     = { workspace = true }

# Phase 4 — sync HTTP for cleanup providers (ADR 0021).
ureq    = { workspace = true }

# Phase MC — CRC32 for meeting chunk-WAV integrity (ADR 0029).
crc32fast = { workspace = true }

# ADR 0046 Iter 2 / mb-p7cp — SHA-256 for projected Markdown content
# addressing in the vault manifest.
sha2      = { workspace = true }

# Phase 10 Wave 5 — PDF export for Activity sessions (ADR 0044).
printpdf  = { workspace = true }

# ADR 0046 Iter 1 / mb-hxm4 — pure-Rust audio decode (.m4a/.wav/.mp3/.ogg)
# for the headless ingest path ("+ Audio file" desktop import + Iter 3
# mobile-inbox courier). default-features=false keeps the link surface to
# only the formats we actually open: AAC + isomp4 (iPhone Voice Memos), WAV
# (the open-ended file-picker fallback), MP3 (legacy uploads), Vorbis+OGG
# (long tail). All MIT/Apache, no system codec deps.
symphonia = { workspace = true }

# ADR 0046 §3.2 / mb-7vyz — sibling input channel for the orchestrator's
# `run` loop (HeadlessIngestRequest), plus the mpsc→crossbeam bridge in
# `dictation::runtime`. See ADR §3.2 for the topology rationale.
crossbeam-channel = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
rstest    = { workspace = true }
proptest  = { workspace = true }
mockall   = { workspace = true }
criterion = { workspace = true }

# Phase 10 Wave 6 — PDF round-trip verification for the
# `pdf-renders-correct-block-count` judge (ADR 0044). Test-only;
# the runtime binary has no business parsing PDFs.
pdf-extract = "0.7"

[[bench]]
name    = "whisper_latency"
harness = false

# Wave 4.9 verification probe — reads the user's mockingbird.db via
# the same rusqlite we ship with, so QA verification doesn't require
# a system sqlite3.exe install.
[[example]]
name = "verify_wave49"
path = "examples/verify_wave49.rs"

# ADR 0046 Iter 1 / mb-jbf7 — programmatic smoke for the desktop
# file-import path. Spins up DictationRuntime + sends a
# HeadlessIngestRequest through the same channel `dictation_import_file`
# IPC uses. Lives in examples/ so it never enters CI; meant for one-shot
# diagnostic + verification of the Iter 1 contract.
[[example]]
name = "smoke_iter1_ingest"
path = "examples/smoke_iter1_ingest.rs"

# Feature flags.
#
# `custom-protocol` is the Tauri 2 toggle that switches release builds
# from `devUrl` (http://localhost:5173 — Vite dev server) to the bundled
# assets under `frontendDist`. `cargo tauri build` enables it implicitly;
# raw `cargo build --release` (which our `scripts/cargo-with-cuda.ps1`
# wrapper uses, because tauri-cli doesn't propagate our CUDA env reliably)
# does NOT — so we make it the default. Without this, the production
# binary boots a webview pointed at a dev server that isn't running and
# users see "localhost refused to connect". (LESSONS 2026-05-17.)
#
# `audible-beeps` is opt-in: it emits short kernel32 Beeps on recording
# start/stop. Default OFF now that the visual overlay (Phase 5) ships
# real feedback; kept around for users on headless / overlay-broken setups.
[features]
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]
audible-beeps    = []

# Notes:
# - Phase 2 Wave 4 added `whisper-rs` (currently CPU-only; see bd mb-ltq).
# - Phase 3 adds `phf` for the injection-strategy override table (ADR 0016)
#   and broader `windows` features for hotkey + injection + window-context
#   (ADRs 0015 / 0017 / 0018 / 0019).
# - `enigo` deliberately NOT used — raw `SendInput` via `windows-rs` gives us
#   Unicode surrogate-pair handling that `enigo` historically botches.
# - `tauri-plugin-global-shortcut` deliberately NOT used — see ADR 0015.
# - `tauri-plugin-sql` deliberately NOT included — see ADR 0004.
