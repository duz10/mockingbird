[package]
name           = "mockingbird"
default-run    = "mockingbird"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description    = "Local-first voice dictation for Windows. Privacy-respecting, self-improving."
# mb-d1ii — `autobins = false` + relocate dev sources OUT of `src/bin/`.
#
# Tauri's MSI bundler does TWO things that conspire to leak dev
# binaries into the user installer:
#   1. It enumerates bin targets from `cargo metadata` and bundles every
#      non-main one (so `[[bin]]` + `required-features` does NOT help).
#   2. It ALSO scans `src/bin/` as a filesystem directory directly
#      (see `tauri-cli/src/interface/rust.rs::get_binaries`) and adds
#      every file/subdir found to the bundle binaries list, regardless
#      of Cargo.toml.
# The fix: keep `autobins = false` (cuts off #1), AND keep `src/bin/`
# empty / nonexistent (cuts off #2). Dev/test/eval/probe one-shots now
# live under `src/dev_bins/` and are declared as `[[example]]` targets
# below. Tauri ignores both `src/dev_bins/` and examples.
# The main `mockingbird` binary is declared explicitly below.
autobins       = false

[lib]
name       = "mockingbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit main binary (required because `autobins = false` above
# also disables auto-discovery of `src/main.rs`).
[[bin]]
name = "mockingbird"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri              = { workspace = true }
tauri-plugin-dialog = { workspace = true }
rusqlite           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
regex              = { workspace = true }

# Phase 2 Wave 1 — Audio capture deps.
cpal               = { workspace = true }
ringbuf            = { workspace = true }
hound              = { workspace = true }
rubato             = { workspace = true }

# Phase 2 Wave 3 — VAD dep.
ort                = { workspace = true }

# Phase 2 Wave 4 — STT dep.
whisper-rs         = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
thiserror          = { workspace = true }

# Phase 3 — per-app injection-strategy override table (ADR 0016).
phf     = { workspace = true }

# Phase 4 — sync HTTP for cleanup providers (ADR 0021).
ureq    = { workspace = true }

# Phase 1A KG (ADR 0049 / mb-2mc9) — YAML for schema-driven KG
# pipeline companion configs. Wired via workspace; see root Cargo.toml.
serde_yaml = { workspace = true }

# Phase MC — CRC32 for meeting chunk-WAV integrity (ADR 0029).
crc32fast = { workspace = true }

# ADR 0046 Iter 2 / mb-p7cp — SHA-256 for projected Markdown content
# addressing in the vault manifest.
sha2      = { workspace = true }

# Phase 10 Wave 5 — PDF export for Activity sessions (ADR 0044).
printpdf  = { workspace = true }

# ADR 0046 Iter 1 / mb-hxm4 — pure-Rust audio decode (.m4a/.wav/.mp3/.ogg)
# for the headless ingest path ("+ Audio file" desktop import + Iter 3
# mobile-inbox courier). default-features=false keeps the link surface to
# only the formats we actually open: AAC + isomp4 (iPhone Voice Memos), WAV
# (the open-ended file-picker fallback), MP3 (legacy uploads), Vorbis+OGG
# (long tail). All MIT/Apache, no system codec deps.
symphonia = { workspace = true }

# ADR 0046 §3.2 / mb-7vyz — sibling input channel for the orchestrator's
# `run` loop (HeadlessIngestRequest), plus the mpsc→crossbeam bridge in
# `dictation::runtime`. See ADR §3.2 for the topology rationale.
crossbeam-channel = { workspace = true }

# ADR 0046 §6 / Iter 3 / mb-9lgi — inbox file-watcher dep. The Wave 0
# spike (`docs/spikes/iter3-sync-layer-findings.md`, Finding 3) shows
# every logical FS change emits 3-4 duplicate events within ~12 ms;
# notify-debouncer-full coalesces these into a single event per path
# per 100 ms quiet window, on top of which our `inbox::watcher` runs
# the size-stability state machine.
notify-debouncer-full = { workspace = true }

# Phase 1B Chunk 5 (`mb-k17a` / ADR 0050 §D8) — promoted from
# `[dev-dependencies]` because the `kg_parity --persist` + the
# `kg_graph_off_invariant` probes are first-class binaries shipped
# in the library (not `#[test]` code; see LESSONS PINNED P2 for why
# probes are binaries on this box). Both stand up tempfile-backed
# SQLite for migration round-trips. Still available to `[dev-deps]`-
# scoped tests because `[dependencies]` is a superset.
tempfile  = { workspace = true }

# mb-mac-v1.2.3 (macOS port) — ONLY genuinely Windows-specific dep here.
# The crates above were inadvertently scoped under this cfg(windows)
# target during the Windows-only era; they are cross-platform and have
# been relocated into [dependencies] so the macOS build links them.
# This is a no-op for Windows (that target sees [dependencies] +
# this block as one set). `windows` stays here by design.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# macOS-only deps. Target-gated so Windows/Linux builds never see them.
[target.'cfg(target_os = "macos")'.dependencies]
# ADR-0056 / mb-mac-v1.4.1 — Keychain-backed SecretStore. Apple's
# canonical Rust Security.framework binding (MIT OR Apache-2.0); exposes
# the generic-password primitives the `KeychainSecretStore` round-trips.
security-framework = "3"

# ADR-0057 / mb-mac-v1.4.4 — global dictation hotkey via CGEventTap.
# Servo's CoreGraphics / CoreFoundation bindings (MIT OR Apache-2.0).
# `core-graphics` provides `CGEventTap` + the CFMachPort→runloop-source
# plumbing; `core-foundation` provides the `CFRunLoop` the tap thread
# pumps (and the thread-safe `CFRunLoopStop` teardown). Low-level by
# design — parity with the Windows `WH_KEYBOARD_LL` hook (ADR 0015),
# which the hotkey state machine needs for key-up visibility.
core-graphics = "0.24"
core-foundation = "0.10"

# ADR-0058 / mb-mac-v1.4.2 — Cmd+V paste injection clipboard layer.
# Cross-platform clipboard crate (Apache-2.0 OR MIT). Supplies the
# text save/restore around the synthesized Cmd+V keypost — the macOS
# analogue of the Win32 save/restore dance in `injection/paste.rs`
# (ADR 0018). `default-features = false` drops the `image-data`
# feature (and the heavy `image` dep tree); dictation only round-trips
# text. The Cmd+V keystroke itself is synthesized via `core-graphics`.
arboard = { version = "3", default-features = false }

# ADR-0059 / mb-mac-v1.4.3 — Accessibility AX secure-input detection.
# Raw Apple Accessibility (AX) FFI (MIT OR Apache-2.0). Reads the
# system-wide focused UI element's role to detect
# `AXSecureTextField` (password fields) — the macOS twin of the
# Windows per-element `ES_PASSWORD` check in `secure_guard.rs`. The
# coarse system-wide `IsSecureEventInputEnabled()` belt-and-suspenders
# signal is linked from the Carbon framework directly (no crate).
accessibility-sys = "0.1"

# ADR-0060 / mb-mac-v1.4.5 — NSWorkspace frontmost-app reader.
# madsmtm's `objc2` family (MIT) — the modern, maintained, memory-safe
# Objective-C bindings, preferred over the older `cocoa`/`objc` crates
# (unmaintained, manual retain/release). ALREADY in the tree transitively
# via Tauri (objc2 0.6 / objc2-*-kit 0.3), so this adds no new vendor:
# we just opt into the `NSWorkspace` + `NSRunningApplication` class
# features. `NSWorkspace.frontmostApplication` yields bundle id + name +
# pid with NO Accessibility grant (the cheap path the plan calls for).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
] }

# ADR-0061 / mb-mac-v1.4.6 — first-launch permissions onboarding.
# The four status-query APIs are reached via direct framework linking
# (the same raw-FFI discipline Wave B2 used for Carbon / accessibility):
#   - Microphone:       AVCaptureDevice.authorizationStatusForMediaType
#                       (AVFoundation framework, AVMediaTypeAudio static)
#   - Input Monitoring: IOHIDCheckAccess (IOKit framework)
#   - Accessibility:    AXIsProcessTrusted (via accessibility-sys, above)
#   - Screen Recording: CGPreflightScreenCaptureAccess (CoreGraphics)
# None of these prompt; they are silent preflight reads. No extra crate
# is needed — `objc2`/`objc2-foundation` (above) supply the NSString +
# msg_send plumbing the AVFoundation call uses.

[dev-dependencies]
rstest    = { workspace = true }
proptest  = { workspace = true }
mockall   = { workspace = true }
criterion = { workspace = true }

# mb-1z0m Round 4 fix gate — enables `tauri::test::mock_builder` /
# `mock_context` / `noop_assets` for the `state_extractor_sees_*`
# regression test in `src-tauri/src/lib.rs`. Dev-dep + workspace
# resolver=2 means the `test` feature does NOT leak into the
# `cargo build --release` graph — only `cargo test`/`--no-run`
# pulls it in. See lib.rs::tests for the exact failure-mode the
# gate protects against.
tauri     = { workspace = true, features = ["test"] }

# Phase 10 Wave 6 — PDF round-trip verification for the
# `pdf-renders-correct-block-count` judge (ADR 0044). Test-only;
# the runtime binary has no business parsing PDFs.
pdf-extract = "0.7"

[[bench]]
name    = "whisper_latency"
harness = false

# Wave 4.9 verification probe — reads the user's mockingbird.db via
# the same rusqlite we ship with, so QA verification doesn't require
# a system sqlite3.exe install.
[[example]]
name = "verify_wave49"
path = "examples/verify_wave49.rs"

# ADR 0046 Iter 1 / mb-jbf7 — programmatic smoke for the desktop
# file-import path. Spins up DictationRuntime + sends a
# HeadlessIngestRequest through the same channel `dictation_import_file`
# IPC uses. Lives in examples/ so it never enters CI; meant for one-shot
# diagnostic + verification of the Iter 1 contract.
[[example]]
name = "smoke_iter1_ingest"
path = "examples/smoke_iter1_ingest.rs"

# Dev/test/eval/probe targets under `src/dev_bins/` (mb-d1ii).
#
# These are KG parity probes, fixture generators, eval harnesses, and
# diagnostic one-shots. They are NOT shipped with the user MSI.
#
# Why `[[example]]` instead of `[[bin]]`, AND why the sources live under
# `src/dev_bins/` instead of the conventional `src/bin/`:
#   - `cargo build --release` builds bins by default but skips
#     examples — so the production build only produces `mockingbird.exe`.
#   - Tauri's MSI bundler enumerates `cargo metadata`'s bin targets to
#     decide what to ship; it does NOT honour `required-features`.
#   - Tauri's bundler ALSO scans `src/bin/` as a raw filesystem dir and
#     adds every entry to the bundle binaries list, IGNORING Cargo.toml
#     (see `tauri-cli` 2.6.2 `interface/rust.rs::get_binaries`). So just
#     reclassifying the targets in Cargo.toml is not enough — the source
#     files have to LIVE somewhere else on disk too.
#   - `src/dev_bins/` is invisible to both Cargo's auto-discovery (it
#     only scans `src/bin/`) and Tauri's hardcoded `src/bin/` scan, so
#     the dev sources never enter either harvest pool.
#   - `cargo run --release --example <name>` Just Works for devs /
#     CI parity runs; the explicit `path = "src/dev_bins/..."` below
#     points Cargo at the relocated source.
#
# Pre-fix attempt history:
#   1. Explicit `[[bin]]` + `required-features = ["dev-tools"]`. Cargo
#      respected the gate, Tauri did not — the alphabetically first bin
#      target (`cleaner_punctuation_eval`) still ended up in the WXS.
#   2. Switching `[[bin]]` -> `[[example]]` while leaving sources under
#      `src/bin/`. Cargo metadata showed only `mockingbird` as a bin,
#      but the WXS STILL referenced `cleaner_punctuation_eval.exe`
#      because Tauri's directory scan picked up the .rs source files
#      directly.
#   3. (Current) Relocate sources to `src/dev_bins/`. Tauri's directory
#      scan finds nothing; only `mockingbird` reaches the bundler.
#
# `kg_parity` originally had a stand-alone entry per Phase 1A Wave 3
# (mb-2mc9 / mb-qdgn) for visibility next to the other workspace
# one-shots; that entry is now folded into this group.

[[example]]
name = "kg_parity"
path = "src/dev_bins/kg_parity.rs"

[[example]]
name = "kg_graph_off_invariant"
path = "src/dev_bins/kg_graph_off_invariant.rs"

[[example]]
name = "kg_source_gate_invariant"
path = "src/dev_bins/kg_source_gate_invariant.rs"

[[example]]
name = "kg_subtree_bootstrap_idempotent"
path = "src/dev_bins/kg_subtree_bootstrap_idempotent.rs"

[[example]]
name = "kg_serializer_golden_roundtrip"
path = "src/dev_bins/kg_serializer_golden_roundtrip.rs"

[[example]]
name = "kg_reverse_watcher_loop_prevention"
path = "src/dev_bins/kg_reverse_watcher_loop_prevention.rs"

[[example]]
name = "kg_file_wins_on_conflict"
path = "src/dev_bins/kg_file_wins_on_conflict.rs"

[[example]]
name = "kg_latency_bench"
path = "src/dev_bins/kg_latency_bench.rs"

[[example]]
name = "generate_fixtures"
path = "src/dev_bins/generate_fixtures.rs"

[[example]]
name = "stt_test"
path = "src/dev_bins/stt_test.rs"

# macOS port Phase 2 (mb-mac-v1.3.3) — Metal-backend transcript judge
# (`mac-p2-metal-transcript`). Runs on macOS only; a no-op stub on other
# targets. Drives `stt::judges_macos_v1::metal_transcript_probe`.
[[example]]
name = "mac_whisper_metal_smoke"
path = "src/dev_bins/mac_whisper_metal_smoke.rs"

# macOS port Phase 2 (mb-mac-v1.3.2) — ORT load-dynamic dylib discovery
# smoke (`mac-p2-ort-dylib`). macOS only; no-op stub elsewhere. Drives
# `audio::judges_macos_v1::ort_vad_session_smoke`.
[[example]]
name = "mac_ort_vad_smoke"
path = "src/dev_bins/mac_ort_vad_smoke.rs"

# macOS port Phase 3a (mb-mac-v1.4.1) — Keychain roundtrip judge
# (`mac-p3a-keychain-roundtrip`). macOS only; exits 2 elsewhere. Drives
# `secrets::judges_macos_v1::keychain_roundtrip_probe`.
[[example]]
name = "mac_keychain_smoke"
path = "src/dev_bins/mac_keychain_smoke.rs"

# macOS port Phase 3 (mb-mac-v1.4.4) — global-hotkey roundtrip judge
# (`mac-p3d-hotkey-roundtrip`). macOS only; exits 2 elsewhere. Drives
# `hotkey::judges_macos_v1::hotkey_roundtrip_probe` — the deterministic
# translation→state-machine boundary (the OS event-tap capture itself
# is verified in the permission-gated `mac-p3-dictation-e2e`).
[[example]]
name = "mac_hotkey_smoke"
path = "src/dev_bins/mac_hotkey_smoke.rs"

# macOS port Phase 3 (mb-mac-v1.4.2) — paste clipboard save/restore
# judge (`mac-p3b-paste-clipboard-saverestore`). macOS only; exits 2
# elsewhere. Drives `injection::judges_macos_v1::paste_clipboard_saverestore_probe`
# — the deterministic save/restore assertion (the Cmd+V keypost itself
# needs Accessibility and is verified in `mac-p3-dictation-e2e`).
[[example]]
name = "mac_paste_smoke"
path = "src/dev_bins/mac_paste_smoke.rs"

# macOS port Phase 3 (mb-mac-v1.4.3) — secure-input abort judge
# (`mac-p3c-secure-input-aborts`). macOS only; exits 2 elsewhere.
# Drives `injection::judges_macos_v1::secure_input_aborts_probe` — the
# AX query sits behind a mockable seam so the abort decision is
# deterministic without a real Accessibility grant.
[[example]]
name = "mac_secure_input_smoke"
path = "src/dev_bins/mac_secure_input_smoke.rs"

# macOS port Phase 3 Wave C (mb-mac-v1.4.5) — frontmost-app reader judge
# (`mac-p3e-frontmost-app-readable`). macOS only; exits 2 elsewhere.
# Drives `window_context::judges_macos_v1::frontmost_app_readable_probe`
# — the permission-free `NSWorkspace.frontmostApplication` read (bundle
# id + localized name); the AX-gated window title is deferred (ADR 0060).
[[example]]
name = "mac_frontmost_smoke"
path = "src/dev_bins/mac_frontmost_smoke.rs"

[[example]]
name = "learn"
path = "src/dev_bins/learn.rs"

[[example]]
name = "cleaner_punctuation_eval"
path = "src/dev_bins/cleaner_punctuation_eval.rs"

[[example]]
name = "mode_eval"
path = "src/dev_bins/mode_eval/main.rs"

# Feature flags.
#
# `custom-protocol` is the Tauri 2 toggle that switches release builds
# from `devUrl` (http://localhost:5173 — Vite dev server) to the bundled
# assets under `frontendDist`. `cargo tauri build` enables it implicitly;
# raw `cargo build --release` (which our `scripts/cargo-with-cuda.ps1`
# wrapper uses, because tauri-cli doesn't propagate our CUDA env reliably)
# does NOT — so we make it the default. Without this, the production
# binary boots a webview pointed at a dev server that isn't running and
# users see "localhost refused to connect". (LESSONS 2026-05-17.)
#
# `audible-beeps` is opt-in: it emits short kernel32 Beeps on recording
# start/stop. Default OFF now that the visual overlay (Phase 5) ships
# real feedback; kept around for users on headless / overlay-broken setups.
[features]
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]
audible-beeps    = []
# Opt-in CUDA acceleration for whisper-rs.
#
# Default build (vanilla `cargo build`) is CPU-only so CI runners and
# downstream packagers without the CUDA toolkit installed can compile.
# Local dev on the Windows + CUDA 12.8 box turns this on via the
# `scripts/dev/cargo-with-cuda.ps1` wrapper, which auto-injects
# `--features mockingbird/cuda` for build-y cargo verbs. Runtime
# behaviour: with this feature off, `WhisperContextParameters::use_gpu(true)`
# is a no-op and we run on CPU; with it on, GPU init is attempted and
# falls back to CPU if the driver is missing or OOM (ADR 0011).
cuda             = ["whisper-rs/cuda"]

# Opt-in Metal acceleration for the whisper_rs STT crate (macOS /
# Apple Silicon).
#
# Mirror of `cuda` above, for the macOS port (mb-mac-v1.3.1). Kept OUT
# of `default` for the same reason `cuda` is: the metal feature pulls
# in Apple's Metal framework + a Metal-backed ggml build that does NOT
# compile on Windows/Linux, so making it default would break the
# cross-platform `cargo build`. Local macOS dev turns this on via the
# `scripts/dev/cargo-mac.sh` wrapper, which auto-injects
# `--features mockingbird/metal` for build-y cargo verbs (the Mac
# analogue of cargo-with-cuda.ps1). Runtime behaviour: with this
# feature off, `WhisperContextParameters::use_gpu(true)` is a no-op and
# we run on CPU; with it on, ggml initialises the Metal backend and
# Whisper runs on the GPU, falling back to CPU if Metal init fails.
#
# The `raw-api` feature is pulled in alongside so the macOS Metal judge
# probe (`stt::judges_macos_v1`) can install a ggml/whisper log callback
# via the re-exported `whisper_rs_sys` and CONFIRM the Metal backend
# actually engaged (vs a silent CPU fallback). raw-api only re-exports
# the -sys bindings; it does not change runtime behaviour.
metal            = ["whisper-rs/metal", "whisper-rs/raw-api"]

# Notes:
# - Phase 2 Wave 4 added `whisper-rs` (currently CPU-only; see bd mb-ltq).
# - Phase 3 adds `phf` for the injection-strategy override table (ADR 0016)
#   and broader `windows` features for hotkey + injection + window-context
#   (ADRs 0015 / 0017 / 0018 / 0019).
# - `enigo` deliberately NOT used — raw `SendInput` via `windows-rs` gives us
#   Unicode surrogate-pair handling that `enigo` historically botches.
# - `tauri-plugin-global-shortcut` deliberately NOT used — see ADR 0015.
# - `tauri-plugin-sql` deliberately NOT included — see ADR 0004.
