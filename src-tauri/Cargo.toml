[package]
name           = "mockingbird"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description    = "Local-first voice dictation for Windows. Privacy-respecting, self-improving."

[lib]
name       = "mockingbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri              = { workspace = true }
rusqlite           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
regex              = { workspace = true }

# Phase 2 Wave 1 — Audio capture deps.
cpal               = { workspace = true }
ringbuf            = { workspace = true }
hound              = { workspace = true }
rubato             = { workspace = true }

# Phase 2 Wave 3 — VAD dep.
ort                = { workspace = true }

# Phase 2 Wave 4 — STT dep.
whisper-rs         = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
thiserror          = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# Phase 3 — per-app injection-strategy override table (ADR 0016).
phf     = { workspace = true }

# Phase 4 — sync HTTP for cleanup providers (ADR 0021).
ureq    = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
rstest    = { workspace = true }
proptest  = { workspace = true }
mockall   = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "whisper_latency"
harness = false

# Wave 4.9 verification probe — reads the user's mockingbird.db via
# the same rusqlite we ship with, so QA verification doesn't require
# a system sqlite3.exe install.
[[example]]
name = "verify_wave49"
path = "examples/verify_wave49.rs"

# Opt-in feature: emit short kernel32 Beeps on recording start/stop.
# Default OFF now that the visual overlay (Phase 5) ships real feedback;
# kept around for users on headless / overlay-broken setups.
[features]
default          = []
audible-beeps    = []

# Notes:
# - Phase 2 Wave 4 added `whisper-rs` (currently CPU-only; see bd mb-ltq).
# - Phase 3 adds `phf` for the injection-strategy override table (ADR 0016)
#   and broader `windows` features for hotkey + injection + window-context
#   (ADRs 0015 / 0017 / 0018 / 0019).
# - `enigo` deliberately NOT used — raw `SendInput` via `windows-rs` gives us
#   Unicode surrogate-pair handling that `enigo` historically botches.
# - `tauri-plugin-global-shortcut` deliberately NOT used — see ADR 0015.
# - `tauri-plugin-sql` deliberately NOT included — see ADR 0004.
