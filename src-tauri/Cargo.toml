[package]
name           = "mockingbird"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description    = "Local-first voice dictation for Windows. Privacy-respecting, self-improving."

[lib]
name       = "mockingbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri              = { workspace = true }
rusqlite           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
regex              = { workspace = true }

# Phase 2 Wave 1 — Audio capture deps.
cpal               = { workspace = true }
ringbuf            = { workspace = true }
hound              = { workspace = true }

# Phase 2 Wave 3 — VAD dep.
ort                = { workspace = true }

# Phase 2 Wave 4 — STT dep.
whisper-rs         = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
thiserror          = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
rstest    = { workspace = true }
proptest  = { workspace = true }
mockall   = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "whisper_latency"
harness = false

# Notes:
# - Phase 2 Wave 4 added `whisper-rs` (currently CPU-only; see bd mb-ltq).
# - Phase 3 will add `enigo` for SendInput fallback.
# - `tauri-plugin-sql` deliberately NOT included — see ADR 0004.
